apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-oracle
  namespace: modernis-dev
spec:
  podSelector:
    matchLabels:
      app: modernis-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.50.10/32 # Oracle VIP (exemple)
      ports:
        - protocol: TCP
          port: 1521
