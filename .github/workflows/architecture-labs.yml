name: Architecture labs unit tests

on:
  push:
    paths:
      - 'labs/**'
      - '09-containerization-kubernetes-openshift-patterns/**'
      - 'scripts/audit-patterns.py'
      - '.github/workflows/architecture-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - '09-containerization-kubernetes-openshift-patterns/**'
      - 'scripts/audit-patterns.py'
      - '.github/workflows/architecture-labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Compile Java lab
        run: |
          mkdir -p /tmp/java-modernization-classes
          javac --add-modules jdk.httpserver -d /tmp/java-modernization-classes labs/java-openshift-modernization/src/ExampleServer.java
      - name: Payment lab tests
        run: python -m unittest discover -s labs/idempotency -v
      - name: AI policy lab tests
        run: python -m unittest discover -s labs/ai-rag-guardrails -v
      - name: Platform lab manifest tests
        run: python -m unittest discover -s labs/java-openshift-modernization -v
      - name: Handbook structural and anonymization QA
        run: python scripts/audit-patterns.py
