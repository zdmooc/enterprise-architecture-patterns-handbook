name: Architecture labs unit tests

on:
  push:
    paths:
      - 'labs/**'
      - '09-containerization-kubernetes-openshift-patterns/**'
      - '10-enterprise-architecture-patterns/**'
      - '11-application-software-patterns/**'
      - '12-data-architecture-patterns/**'
      - '13-resilience-distributed-systems-patterns/**'
      - '14-security-zero-trust-patterns/**'
      - '15-cloud-hybrid-architecture-patterns/**'
      - '16-performance-sre-patterns/**'
      - '17-legacy-modernization-patterns/**'
      - '18-enterprise-integration-patterns/**'
      - '19-java-design-patterns-gof/**'
      - '20-decision-management-patterns/**'
      - '21-platform-engineering-patterns/**'
      - '22-pattern-applications/**'
      - 'references/**'
      - 'README.md'
      - 'diagrams/**'
      - 'scripts/audit-patterns.py'
      - '.github/workflows/architecture-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - '09-containerization-kubernetes-openshift-patterns/**'
      - '10-enterprise-architecture-patterns/**'
      - '11-application-software-patterns/**'
      - '12-data-architecture-patterns/**'
      - '13-resilience-distributed-systems-patterns/**'
      - '14-security-zero-trust-patterns/**'
      - '15-cloud-hybrid-architecture-patterns/**'
      - '16-performance-sre-patterns/**'
      - '17-legacy-modernization-patterns/**'
      - '18-enterprise-integration-patterns/**'
      - '19-java-design-patterns-gof/**'
      - '20-decision-management-patterns/**'
      - '21-platform-engineering-patterns/**'
      - '22-pattern-applications/**'
      - 'references/**'
      - 'README.md'
      - 'diagrams/**'
      - 'scripts/audit-patterns.py'
      - '.github/workflows/architecture-labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Compile Java lab
        run: |
          mkdir -p /tmp/java-modernization-classes
          javac --add-modules jdk.httpserver -d /tmp/java-modernization-classes labs/java-openshift-modernization/src/ExampleServer.java
      - name: Payment lab tests
        run: python -m unittest discover -s labs/idempotency -v
      - name: AI policy lab tests
        run: python -m unittest discover -s labs/ai-rag-guardrails -v
      - name: Platform lab manifest tests
        run: python -m unittest discover -s labs/java-openshift-modernization -v
      - name: GoF Java 17 executable laboratory
        run: |
          mkdir -p /tmp/gof-classes
          javac -d /tmp/gof-classes labs/java-gof/PatternsLab.java
          java -cp /tmp/gof-classes PatternsLab
      - name: Handbook structural and anonymization QA
        run: python scripts/audit-patterns.py
