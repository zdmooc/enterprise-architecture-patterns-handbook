name: Architecture labs unit tests

on:
  push:
    paths:
      - 'labs/**'
      - '.github/workflows/architecture-labs.yml'
  pull_request:
    paths:
      - 'labs/**'
      - '.github/workflows/architecture-labs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Payment intent and Outbox tests
        run: python -m unittest discover -s labs/idempotency -v
      - name: AI retrieval and approval policy tests
        run: python -m unittest discover -s labs/ai-rag-guardrails -v
