name: Preserve legacy historical-architecture
on:
  push:
    paths:
      - .github/workflows/preserve-legacy-historical-architecture.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preserve-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Checkout historical MayaBank-V2 (pinned)
        uses: actions/checkout@v4
        with:
          repository: zdmooc/MayaBank-V2
          ref: ad10ac2cb48acf834fb40102d8e808e5081ddf20
          path: .legacy-input/MayaBank-V2
          persist-credentials: false
      - name: Checkout historical archimate-level1-companion-repo (pinned)
        uses: actions/checkout@v4
        with:
          repository: zdmooc/archimate-level1-companion-repo
          ref: 611b0e6cb9d0a6ecc7e7a32181c9ddc5fae0fe9f
          path: .legacy-input/archimate-level1-companion-repo
          persist-credentials: false
      - name: Checkout historical archimate-level2-companion-repo (pinned)
        uses: actions/checkout@v4
        with:
          repository: zdmooc/archimate-level2-companion-repo
          ref: ab68b29dc084a7e84d13f046addae51e9e97b206
          path: .legacy-input/archimate-level2-companion-repo
          persist-credentials: false
      - name: Copy and SHA-check every original Git blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          specs = json.loads('[{"repo":"MayaBank-V2","commit":"ad10ac2cb48acf834fb40102d8e808e5081ddf20","files":206},{"repo":"archimate-level1-companion-repo","commit":"611b0e6cb9d0a6ecc7e7a32181c9ddc5fae0fe9f","files":92},{"repo":"archimate-level2-companion-repo","commit":"ab68b29dc084a7e84d13f046addae51e9e97b206","files":103}]')
          base = pathlib.Path("legacy/historical-architecture")
          base.mkdir(parents=True, exist_ok=True)
          manifest = {"schema": 1, "date": "2026-10-20", "destination_repository": "zdmooc/enterprise-architecture-patterns-handbook", "source_history_copied": False, "runtime_verified": False, "sources": [], "status": "CONTENT_TRANSFER_PENDING_PR_MERGE"}
          total = 0
          for spec in specs:
              path = pathlib.Path(".legacy-input") / spec["repo"]
              commit = subprocess.check_output(["git", "-C", str(path), "rev-parse", "HEAD"], text=True).strip()
              assert commit == spec["commit"], (commit, spec["commit"])
              entries = subprocess.check_output(["git", "-C", str(path), "ls-tree", "-r", "-z", "HEAD"]).split(b"\x00")
              files = []
              for entry in entries:
                  if not entry:
                      continue
                  hdr, filename = entry.split(b"\t", 1)
                  mode, typ, sha = hdr.decode("ascii").split(" ")
                  assert typ == "blob" and mode in ("100644", "100755"), (mode, typ)
                  relative = os.fsdecode(filename)
                  raw = subprocess.check_output(["git", "-C", str(path), "show", "HEAD:" + relative])
                  digest = hashlib.sha1(("blob " + str(len(raw)) + "\x00").encode() + raw).hexdigest()
                  assert digest == sha, relative
                  dest = base / spec["repo"] / relative
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(raw)
                  dest.chmod(0o755 if mode == "100755" else 0o644)
                  assert hashlib.sha1(("blob " + str(dest.stat().st_size) + "\x00").encode() + dest.read_bytes()).hexdigest() == sha
                  files.append({"source": relative, "destination": str(dest), "sha": sha, "mode": mode, "bytes": len(raw)})
                  total += 1
              assert len(files) == spec["files"], (spec["repo"], len(files), spec["files"])
              manifest["sources"].append({"repository": "zdmooc/" + spec["repo"], "commit": commit, "branch": "main", "count": len(files), "files": files})
          manifest["total"] = total
          (base / "source-map.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (base / "MIGRATION.md").write_text("# Historical repository preservation\n\nAll " + str(total) + " Git-tracked source blobs were copied byte-for-byte from the pinned historical commit(s). The exact SHA and original modes are in [source-map.json](source-map.json). The original repository licenses remain in their original relative paths. Git history, issues, tags and repository settings are not imported. This is file preservation only, not proof of runtime, successful builds, or tests. Do not delete archived sources until every SHA is verified after merge on main.\n", encoding="utf-8")
          readme = pathlib.Path("README.md")
          heading = "\n## Historical preservation — historical-architecture (20 Oct 2026)\n\nOriginal archived source reference(s) are preserved without modifications under [legacy/historical-architecture/](legacy/historical-architecture/MIGRATION.md), with " + str(total) + " SHA-verified files, including any binary files and original license documents. This is not a claim of runtime validation.\n"
          assert readme.exists()
          if "## Historical preservation — historical-architecture" not in readme.read_text(encoding="utf-8"):
              with readme.open("a", encoding="utf-8") as stream:
                  stream.write(heading)
          print("SOURCE_BLOB_SHA_VERIFIED:", total, "/", total)

          PY
      - name: Commit preservation branch without source checkouts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .legacy-input
          git switch -c consolidation/legacy-historical-architecture-2026-10-20
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- legacy/historical-architecture/ README.md
          # Do not reject the original historical Markdown whitespace; SHA fidelity requires it.
          git commit -m 'archive: preserve 3 historical source repositories for historical-architecture'
          git push origin HEAD:refs/heads/consolidation/legacy-historical-architecture-2026-10-20
